<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- A white card, so that the diagram reads the same on light and dark pages. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#68706b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="279" rx="12" fill="#ffffff" stroke="#d9dfda"/>

  <!-- The members: each plays YouTube Music in their own Chrome. -->
  <g>
    <rect x="24" y="24" width="300" height="64" rx="8" fill="#f6f7f5" stroke="#d9dfda"/>
    <text x="44" y="51" font-size="15" font-weight="700" fill="#191d1b">Chrome of a member</text>
    <text x="44" y="72" font-size="13" fill="#68706b">YouTube Music + the extension</text>
  </g>
  <g>
    <rect x="24" y="108" width="300" height="64" rx="8" fill="#f6f7f5" stroke="#d9dfda"/>
    <text x="44" y="135" font-size="15" font-weight="700" fill="#191d1b">Chrome of a member</text>
    <text x="44" y="156" font-size="13" fill="#68706b">YouTube Music + the extension</text>
  </g>
  <g>
    <rect x="24" y="192" width="300" height="64" rx="8" fill="#f6f7f5" stroke="#d9dfda"/>
    <text x="44" y="219" font-size="15" font-weight="700" fill="#191d1b">Chrome of a member</text>
    <text x="44" y="240" font-size="13" fill="#68706b">YouTube Music + the extension</text>
  </g>

  <!-- Commands go to the server; every change of the room comes back as an event. -->
  <g stroke="#68706b" stroke-width="1.6" fill="none">
    <line x1="330" y1="56" x2="512" y2="112" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="330" y1="140" x2="512" y2="140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="330" y1="224" x2="512" y2="168" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="421" y="131" font-size="13" font-weight="700" fill="#68706b" text-anchor="middle">HTTPS + token</text>

  <!-- The room server keeps each room. -->
  <g>
    <rect x="520" y="72" width="256" height="136" rx="8" fill="#eef9fa" stroke="#9bd5da"/>
    <text x="540" y="104" font-size="16" font-weight="700" fill="#056672">Room server</text>
    <text x="540" y="132" font-size="13" fill="#191d1b">Keeps the queue of each room</text>
    <text x="540" y="152" font-size="13" fill="#191d1b">and its position in the song,</text>
    <text x="540" y="172" font-size="13" fill="#191d1b">and sends every change</text>
    <text x="540" y="192" font-size="13" fill="#191d1b">to the members</text>
  </g>
</svg>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Music Together</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <!-- The note of icons/icon.svg, placed as there, in the middle of a square around its center. -->
    <symbol id="icon-logo" viewBox="6 6 116 116"><g transform="translate(-4 3)"><path d="M50 30 100 20v16L50 46z"/><rect x="50" y="38" width="8" height="50"/><rect x="92" y="28" width="8" height="50"/><ellipse cx="47" cy="90" rx="15" ry="11" transform="rotate(-20 47 90)"/><ellipse cx="89" cy="80" rx="15" ry="11" transform="rotate(-20 89 80)"/></g></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm7 0h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="M5 6.5v11a1 1 0 0 0 1.57.82l7.86-5.5a1 1 0 0 0 0-1.64L6.57 5.68A1 1 0 0 0 5 6.5zM17 5h1.5a.5.5 0 0 1 .5.5v13a.5.5 0 0 1-.5.5H17a.5.5 0 0 1-.5-.5v-13A.5.5 0 0 1 17 5z"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><path d="M9 3h9a2 2 0 0 1 2 2v11h-2V5H9V3zM6 7h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm0 2v10h9V9H6z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.17 10.44l4.45 4.44-1.42 1.42-4.44-4.45A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></symbol>
    <symbol id="icon-add" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></symbol>
    <symbol id="icon-remove" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-listening" viewBox="0 0 24 24"><path d="M4 10h4v10H4zM10 4h4v16h-4zM16 13h4v7h-4z"/></symbol>
    <symbol id="icon-standby" viewBox="0 0 24 24"><path d="M7 3h10v2h-1v2.6a3 3 0 0 1-1.1 2.3L12.6 12l2.3 2.1a3 3 0 0 1 1.1 2.3V19h1v2H7v-2h1v-2.6a3 3 0 0 1 1.1-2.3l2.3-2.1-2.3-2.1A3 3 0 0 1 8 7.6V5H7zm3 2v2.6a1 1 0 0 0 .4.8L12 9.8l1.6-1.4a1 1 0 0 0 .4-.8V5zm2 9.2-1.6 1.4a1 1 0 0 0-.4.8V19h4v-2.6a1 1 0 0 0-.4-.8z"/></symbol>
    <symbol id="icon-playlist" viewBox="0 0 24 24"><path d="M4 6h12v2H4zm0 5h12v2H4zm0 5h8v2H4zm13-1v-3h2v3h3v2h-3v3h-2v-3h-3v-2z"/></symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-person" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m9.5 15.6 9.2-9.2 1.4 1.4L9.5 18.4 3.9 12.8l1.4-1.4 4.2 4.2z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 5V2.4M12 19v2.6M19 12h2.6M5 12H2.4M16.95 7.05l1.84-1.84M16.95 16.95l1.84 1.84M7.05 16.95l-1.84 1.84M7.05 7.05 5.21 5.21" fill="none" stroke="currentColor" stroke-width="2.6"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#icon-logo"/></svg></span>
      <h1>Music Together</h1>
    </div>
    <div class="topbar-actions">
      <button id="leave" class="button" type="button" hidden></button>
      <button id="settings" class="icon-button" type="button" aria-pressed="false" aria-controls="settings-view" data-i18n-label="settings" data-i18n-title="settings">
        <svg class="icon"><use href="#icon-settings"/></svg>
      </button>
    </div>
  </header>

  <main>
    <button id="update" class="update" type="button" hidden>
      <span id="update-text"></span>
      <svg class="icon"><use href="#icon-chevron"/></svg>
    </button>

    <section id="no-tab" class="panel message" hidden>
      <p data-i18n="needTab"></p>
      <button id="open-ytm" class="primary" type="button" data-i18n="openYouTubeMusic"></button>
    </section>

    <section id="reload" class="panel message" hidden>
      <p data-i18n="needReload"></p>
      <button id="reload-tab" class="primary" type="button" data-i18n="reload"></button>
    </section>

    <section id="setup" class="panel message" hidden>
      <p data-i18n="needSetup"></p>
      <button id="open-settings" class="primary" type="button" data-i18n="openSettings"></button>
    </section>

    <section id="lobby" class="stack" hidden>
      <div class="choice" role="tablist" data-i18n-label="lobbyChoice">
        <button id="tab-create" class="choice-button" type="button" role="tab" aria-controls="create-form" data-i18n="createRoom"></button>
        <button id="tab-join" class="choice-button" type="button" role="tab" aria-controls="join-form" data-i18n="joinRoom"></button>
      </div>

      <form id="create-form" class="panel form" role="tabpanel">
        <label class="field">
          <span data-i18n="yourName"></span>
          <input id="host-name" class="name" maxlength="30" autocomplete="nickname">
        </label>
        <button id="create" class="primary" type="submit" data-i18n="createRoom"></button>
      </form>

      <form id="join-form" class="panel form" role="tabpanel">
        <p id="invite-note" class="note" hidden></p>
        <label class="field">
          <span data-i18n="yourName"></span>
          <input id="guest-name" class="name" maxlength="30" autocomplete="nickname">
        </label>
        <label class="field">
          <span data-i18n="roomId"></span>
          <input id="room-id" class="code" maxlength="8" autocomplete="off" spellcheck="false">
        </label>
        <button id="join" class="primary" type="submit" data-i18n="join"></button>
      </form>

      <p id="lobby-error" class="alert" role="alert" hidden></p>
      <button id="open-site-settings" class="button" type="button" data-i18n="openSiteSettings" hidden></button>
    </section>

    <section id="room" class="stack" hidden>
      <p id="ending" class="alert" role="status" hidden></p>
      <p id="conn" class="conn" hidden></p>

      <div id="now" class="panel now">
        <div class="now-row">
          <button id="now-art" class="art large" type="button" disabled></button>
          <div class="text">
            <p id="now-title" class="title"></p>
            <div class="sub-row">
              <p id="now-sub" class="sub"></p>
              <span id="now-by" class="by" hidden></span>
            </div>
          </div>
          <div class="controls">
            <button id="toggle" class="square primary-square" type="button" data-i18n-label="play">
              <svg class="icon play"><use href="#icon-play"/></svg>
              <svg class="icon pause"><use href="#icon-pause"/></svg>
            </button>
            <button id="next" class="square" type="button" data-i18n-label="nextSong" data-i18n-title="nextSong">
              <svg class="icon"><use href="#icon-next"/></svg>
            </button>
          </div>
        </div>
        <div class="seek">
          <span id="seek-at" class="seek-time"></span>
          <input id="seek" class="seek-bar" type="range" min="0" max="1" step="any" value="0" data-i18n-label="seekPosition" disabled>
          <span id="seek-end" class="seek-time end"></span>
        </div>
      </div>

      <div id="queue-panel" class="panel queue">
        <div class="section-head">
          <h2 class="section-heading">
            <button id="queue-fold" class="fold" type="button" aria-expanded="false" aria-controls="queue-scroll">
              <span class="section-label">
                <span class="section-title" data-i18n="queueTitle"></span>
                <span id="queue-count" class="section-count"></span>
              </span>
              <span class="fold-chevron" aria-hidden="true">
                <svg class="icon"><use href="#icon-chevron"/></svg>
              </span>
            </button>
          </h2>
          <div class="head-actions">
            <button id="shuffle-queue" class="head-icon" type="button" data-i18n-label="shuffleQueue" data-i18n-title="shuffleQueue" hidden>
              <svg class="icon"><use href="#icon-shuffle"/></svg>
            </button>
            <button id="save-playlist" class="head-icon" type="button" data-i18n-label="savePlaylist" data-i18n-title="savePlaylist" hidden>
              <svg class="icon"><use href="#icon-playlist"/></svg>
            </button>
          </div>
        </div>
        <div id="queue-body" class="queue-body">
          <div id="queue-scroll" class="queue-scroll">
            <div id="drop-line" class="drop-line" hidden></div>
            <ul id="played" class="list played" data-i18n-label="playedSongs"></ul>
            <ul id="current" class="list current" data-i18n-label="nowPlaying"></ul>
            <ul id="queue" class="list" data-i18n-label="upNext"></ul>
          </div>
          <div id="standby-section" class="standby-section">
            <button id="standby-head" class="standby-head" type="button" aria-expanded="false" aria-controls="standby-scroll">
              <span class="standby-title" data-i18n="standbyTitle"></span>
              <span id="standby-count" class="standby-count"></span>
              <svg class="icon chevron"><use href="#icon-chevron"/></svg>
            </button>
            <div id="standby-scroll" class="standby-scroll" hidden>
              <div id="standby-drop-line" class="drop-line" hidden></div>
              <ul id="standby" class="list" data-i18n-label="standbyTitle"></ul>
            </div>
          </div>
        </div>
      </div>

      <div class="panel search-panel">
        <form id="search-form" class="search" role="search">
          <svg class="icon"><use href="#icon-search"/></svg>
          <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchSongs" data-i18n-label="searchSongs">
        </form>
        <p id="results-message" class="list-message" hidden></p>
        <ul id="results" class="list results" data-i18n-label="searchResults" hidden></ul>
      </div>

      <div class="panel room-card">
        <dl class="facts">
          <div>
            <dt data-i18n="roomId"></dt>
            <dd class="room-id-row">
              <button id="copy-id" class="room-id" type="button" data-i18n-title="copyRoomId">
                <span id="room-id-text"></span>
                <svg class="icon"><use href="#icon-copy"/></svg>
              </button>
              <button id="copy-invite" class="invite-link" type="button" data-i18n-title="copyInviteLink">
                <svg class="icon"><use href="#icon-link"/></svg>
                <span data-i18n="inviteLink"></span>
              </button>
            </dd>
          </div>
          <div><dt data-i18n="host"></dt><dd id="host-member"></dd></div>
        </dl>
        <details id="guests" class="guests">
          <summary>
            <span data-i18n="participants"></span>
            <svg class="icon chevron"><use href="#icon-chevron"/></svg>
          </summary>
          <ul id="guest-list" class="guest-list"></ul>
        </details>
        <label id="control-row" class="switch" hidden>
          <span data-i18n="participantControl"></span>
          <input id="participant-control" type="checkbox" role="switch">
        </label>
      </div>
    </section>

    <section id="settings-view" class="stack" data-i18n-label="settings" hidden>
      <div class="panel form">
        <label class="field">
          <span data-i18n="language"></span>
          <select id="language">
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <div class="field" role="radiogroup" aria-labelledby="display-label">
          <span id="display-label" data-i18n="display"></span>
          <div class="radios">
            <label class="radio">
              <input type="radio" name="display" value="window">
              <span>Mini window</span>
            </label>
            <label class="radio">
              <input type="radio" name="display" value="panel">
              <span>Side panel</span>
            </label>
          </div>
        </div>
      </div>

      <form id="server-form" class="panel form" novalidate>
        <h2 class="form-title" data-i18n="roomServer"></h2>
        <label class="field">
          <span data-i18n="server"></span>
          <input id="server" type="url" inputmode="url" placeholder="https://" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span data-i18n="token"></span>
          <input id="token" type="password" autocomplete="off" spellcheck="false">
        </label>
        <p id="settings-error" class="settings-error" role="alert" hidden></p>
        <div class="actions">
          <button id="save" class="primary save" type="submit" data-i18n="save"></button>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="art-viewer" class="art-viewer" role="dialog" aria-modal="true" data-i18n-label="closeArtwork" hidden>
    <div id="art-viewer-card" class="art-viewer-card">
      <div id="art-viewer-frame" class="art-viewer-frame">
        <img id="art-viewer-img" alt="" referrerpolicy="no-referrer">
      </div>
      <div class="art-viewer-meta">
        <p id="art-viewer-title" class="title"></p>
        <p id="art-viewer-sub" class="sub"></p>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Music Together</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="icon-logo" viewBox="0 0 24 24"><path d="M9 5.2 19 3.2v3L9 8.2z"/><rect x="9" y="7" width="1.6" height="10"/><rect x="17.4" y="5" width="1.6" height="10"/><ellipse cx="7.9" cy="17.4" rx="2.9" ry="2.2" transform="rotate(-20 7.9 17.4)"/><ellipse cx="16.3" cy="15.4" rx="2.9" ry="2.2" transform="rotate(-20 16.3 15.4)"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm7 0h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="M5 6.5v11a1 1 0 0 0 1.57.82l7.86-5.5a1 1 0 0 0 0-1.64L6.57 5.68A1 1 0 0 0 5 6.5zM17 5h1.5a.5.5 0 0 1 .5.5v13a.5.5 0 0 1-.5.5H17a.5.5 0 0 1-.5-.5v-13A.5.5 0 0 1 17 5z"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><path d="M9 3h9a2 2 0 0 1 2 2v11h-2V5H9V3zM6 7h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm0 2v10h9V9H6z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.17 10.44l4.45 4.44-1.42 1.42-4.44-4.45A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></symbol>
    <symbol id="icon-add" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></symbol>
    <symbol id="icon-remove" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-person" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m9.5 15.6 9.2-9.2 1.4 1.4L9.5 18.4 3.9 12.8l1.4-1.4 4.2 4.2z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 5V2.4M12 19v2.6M19 12h2.6M5 12H2.4M16.95 7.05l1.84-1.84M16.95 16.95l1.84 1.84M7.05 16.95l-1.84 1.84M7.05 7.05 5.21 5.21" fill="none" stroke="currentColor" stroke-width="2.6"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#icon-logo"/></svg></span>
      <h1>Music Together</h1>
    </div>
    <div class="topbar-actions">
      <button id="leave" class="button" type="button" hidden></button>
      <button id="settings" class="icon-button" type="button" data-i18n-label="settings" data-i18n-title="settings">
        <svg class="icon"><use href="#icon-settings"/></svg>
      </button>
    </div>
  </header>

  <main>
    <button id="update" class="update" type="button" hidden>
      <span id="update-text"></span>
      <svg class="icon"><use href="#icon-chevron"/></svg>
    </button>

    <section id="no-tab" class="panel message" hidden>
      <p data-i18n="needTab"></p>
      <button id="open-ytm" class="primary" type="button" data-i18n="openYouTubeMusic"></button>
    </section>

    <section id="reload" class="panel message" hidden>
      <p data-i18n="needReload"></p>
      <button id="reload-tab" class="primary" type="button" data-i18n="reload"></button>
    </section>

    <section id="setup" class="panel message" hidden>
      <p data-i18n="needSetup"></p>
      <button id="open-settings" class="primary" type="button" data-i18n="openSettings"></button>
    </section>

    <section id="lobby" class="stack" hidden>
      <div class="choice" role="tablist" data-i18n-label="lobbyChoice">
        <button id="tab-create" class="choice-button" type="button" role="tab" aria-controls="create-form" data-i18n="createRoom"></button>
        <button id="tab-join" class="choice-button" type="button" role="tab" aria-controls="join-form" data-i18n="joinRoom"></button>
      </div>

      <form id="create-form" class="panel form" role="tabpanel">
        <label class="field">
          <span data-i18n="yourName"></span>
          <input id="host-name" class="name" maxlength="30" autocomplete="nickname">
        </label>
        <button id="create" class="primary" type="submit" data-i18n="createRoom"></button>
      </form>

      <form id="join-form" class="panel form" role="tabpanel">
        <label class="field">
          <span data-i18n="yourName"></span>
          <input id="guest-name" class="name" maxlength="30" autocomplete="nickname">
        </label>
        <label class="field">
          <span data-i18n="roomId"></span>
          <input id="room-id" class="code" maxlength="8" autocomplete="off" spellcheck="false">
        </label>
        <button id="join" class="primary" type="submit" data-i18n="join"></button>
      </form>

      <p id="lobby-error" class="alert" role="alert" hidden></p>
    </section>

    <section id="room" class="stack" hidden>
      <p id="conn" class="conn" hidden></p>

      <div id="now" class="panel now" hidden>
        <div class="now-row">
          <div id="now-art" class="art large"></div>
          <div class="text">
            <p id="now-title" class="title"></p>
            <div class="sub-row">
              <p id="now-sub" class="sub"></p>
              <span id="now-by" class="by" hidden></span>
            </div>
          </div>
          <div class="controls">
            <button id="toggle" class="square primary-square" type="button" data-i18n-label="play">
              <svg class="icon play"><use href="#icon-play"/></svg>
              <svg class="icon pause"><use href="#icon-pause"/></svg>
            </button>
            <button id="next" class="square" type="button" data-i18n-label="nextSong" data-i18n-title="nextSong">
              <svg class="icon"><use href="#icon-next"/></svg>
            </button>
          </div>
        </div>
        <canvas id="viz" class="viz" aria-hidden="true"></canvas>
      </div>

      <div id="queue-panel" class="panel queue" hidden>
        <h2 class="section-title" data-i18n="upNext"></h2>
        <ul id="queue" class="list" data-i18n-label="upNext"></ul>
      </div>

      <form id="search-form" class="search" role="search">
        <svg class="icon"><use href="#icon-search"/></svg>
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchSongs" data-i18n-label="searchSongs">
      </form>
      <p id="results-message" class="list-message" hidden></p>
      <ul id="results" class="panel list results" data-i18n-label="searchResults" hidden></ul>

      <div class="panel room-card">
        <dl class="facts">
          <div>
            <dt data-i18n="roomId"></dt>
            <dd>
              <button id="copy-id" class="room-id" type="button" data-i18n-title="copyRoomId">
                <span id="room-id-text"></span>
                <svg class="icon"><use href="#icon-copy"/></svg>
              </button>
            </dd>
          </div>
          <div><dt data-i18n="host"></dt><dd id="host-member"></dd></div>
        </dl>
        <details id="guests" class="guests">
          <summary>
            <span data-i18n="participants"></span>
            <svg class="icon chevron"><use href="#icon-chevron"/></svg>
          </summary>
          <ul id="guest-list" class="guest-list"></ul>
        </details>
        <label id="control-row" class="switch" hidden>
          <span data-i18n="participantControl"></span>
          <input id="participant-control" type="checkbox" role="switch">
        </label>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

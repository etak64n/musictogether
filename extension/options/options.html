<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Together</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="options.css">
  <script src="options.js" type="module"></script>
</head>
<body>
  <main class="page">
    <header class="heading">
      <img class="logo" src="../icons/icon48.png" alt="">
      <h1 data-i18n="settingsTitle"></h1>
    </header>

    <section class="panel">
      <label class="field">
        <span data-i18n="language"></span>
        <select id="language">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="display"></span>
        <select id="display">
          <option value="window" data-i18n="displayWindow"></option>
          <option value="panel" data-i18n="displayPanel"></option>
        </select>
      </label>
    </section>

    <form id="server-form" class="panel" novalidate>
      <h2 data-i18n="roomServer"></h2>
      <label class="field">
        <span data-i18n="server"></span>
        <input id="server" type="url" inputmode="url" placeholder="https://" autocomplete="off" spellcheck="false">
        <small data-i18n="serverHint"></small>
      </label>
      <label class="field">
        <span data-i18n="token"></span>
        <input id="token" type="password" autocomplete="off" spellcheck="false">
        <small data-i18n="tokenHint"></small>
      </label>
      <div class="actions">
        <button class="primary" type="submit" data-i18n="save"></button>
        <p id="status" class="status" role="status" hidden></p>
      </div>
    </form>
  </main>
</body>
</html>

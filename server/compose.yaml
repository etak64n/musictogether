# Runs the room server on port 8080 of this machine, keeping the rooms in a
# named volume. The extension needs HTTPS, so put a reverse proxy or a tunnel
# in front of it. The token comes from the .env file next to this file.
services:
  musictogether:
    build: .
    restart: unless-stopped
    environment:
      # The server listens on every interface inside its container. The ports
      # line below publishes it on 127.0.0.1 of this machine only.
      ADDR: "0.0.0.0:8080"
      DATA_DIR: /data
      LOG_FORMAT: json
      TOKEN: ${TOKEN:?Please copy .env.example to .env and set TOKEN in it}
    volumes:
      - rooms:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  rooms:

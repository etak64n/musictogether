<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.77 14.77 98.46 98.46">
  <!-- The icon of Music Together in a browser tab. A tab draws it at 16 pixels, where the
       whole tile looks small beside the icons of other sites, so it shows the middle of the
       tile, 1.3 times as large. On dark tabs, which hide the teal tile, the tile is lighter. -->
  <style>
    .tile { fill: #087f8c; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #2aa5b2; }
    }
  </style>
  <rect class="tile" width="128" height="128" rx="26"/>
  <g fill="#fff" transform="translate(-4 3)">
    <path d="M50 30 100 20v16L50 46z"/>
    <rect x="50" y="38" width="8" height="50"/>
    <rect x="92" y="28" width="8" height="50"/>
    <ellipse cx="47" cy="90" rx="15" ry="11" transform="rotate(-20 47 90)"/>
    <ellipse cx="89" cy="80" rx="15" ry="11" transform="rotate(-20 89 80)"/>
  </g>
</svg>
